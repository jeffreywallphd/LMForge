name: llmforge
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  
  # PyTorch with CUDA support (adjust cudatoolkit version based on your GPU)
  - pytorch>=2.0.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8  # Change to 12.1 or 12.4 if you have newer CUDA
  
  # Core ML libraries
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  - scikit-learn>=1.3.0
  
  # Statistical analysis packages
  - statsmodels>=0.14.0
  - pingouin>=0.5.0
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  
  # Jupyter support
  - jupyter
  - ipykernel
  - notebook
  
  # Utilities
  - tqdm
  - pyyaml
  
  # Pip packages (install via pip for better compatibility)
  - pip:
    # HuggingFace ecosystem
    - transformers>=4.30.0
    - datasets>=2.12.0
    - evaluate>=0.4.0
    - huggingface-hub>=0.15.0
    - accelerate>=0.20.0
    - tokenizers>=0.13.0
    - safetensors>=0.3.0
    
    # Statistical and scientific computing
    - scikit-bio>=0.5.8  # For PERMANOVA
    
    # Environment and config
    - python-dotenv>=1.0.0
    
    # Additional utilities
    - sentencepiece>=0.1.99  # For some tokenizers
    
    # Optional: For better performance
    - ninja  # Faster compilation if needed
    
    # Jupyter extensions (optional but useful)
    - jupyterlab>=4.0.0
    - ipywidgets>=8.0.0

